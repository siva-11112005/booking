services:
  - type: web
    name: eswari-physiotherapy
    env: node
    region: singapore
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.10.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://booking-fskl.onrender.com
      - key: RENDER_SERVICE_NAME
        value: eswari-physiotherapy
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_FROM_NUMBER
        value: Eswari
      - key: ADMIN_PHONE
        value: +917418042205
      - key: OTP_VALIDITY_MINUTES
        value: 5
      - key: MAX_OTP_PER_DAY
        value: 5
      # Email (Gmail SMTP)
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Free SMS Gateway (optional)
      - key: SMS_GATEWAY_USERNAME
        sync: false
      - key: SMS_GATEWAY_PASSWORD
        sync: false
      # Twilio fallback (optional)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false